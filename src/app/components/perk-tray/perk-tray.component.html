<div class="perks" role="group" [attr.aria-label]="'PERKS' | translate">
  @for (perk of perks; track perk) {
    <button class="perk" type="button" [class.owned]="inventory[perk] > 0" [class.ready]="available.has(perk)" [class.highlighted]="highlight.includes(perk)" [class.fired]="fired === perk"
      [class.active]="active === perk || (doubling && perk === double) || (saved && perk === save)"
      [attr.aria-disabled]="!available.has(perk)" [attr.aria-pressed]="active === perk"
      [attr.aria-label]="('PERK_' + perk | translate) + ': ' + inventory[perk]" [title]="'PERK_' + perk + '_INFO' | translate"
      (click)="use.emit(perk)">
      <app-perk-icon [perk]="perk"></app-perk-icon>
      @if (inventory[perk] > 0) {
        <span class="count">{{ inventory[perk] }}</span>
      }
    </button>
  }
</div>
<p class="hint" aria-live="polite">{{ hint }}</p>
