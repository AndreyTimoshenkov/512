<div class="play-area">
  <app-locale-switcher (localeChanged)="onLocaleChanged($event)"></app-locale-switcher>

  <div class="scoreboard">
    <div class="scoreboard_text">
      <p>{{'TURN' | translate }}: {{ turn$$() }}</p>
      <p>{{'SCORE' | translate }}: {{ score$$() }}</p>
    </div>
    <button (click)="restartGame()">{{ 'NEW_GAME' | translate }}</button>
    <div class="help" (mouseenter)="instructionsOpen.set(true)" (mouseleave)="instructionsOpen.set(false)">
      <button class="info-button" type="button" aria-controls="game-instructions"
        [attr.aria-label]="'HOW_TO_PLAY' | translate" [attr.aria-expanded]="instructionsOpen()"
        (focus)="instructionsOpen.set(true)" (click)="instructionsOpen.set(true)">i</button>
      @if (instructionsOpen()) {
        <div class="rules" id="game-instructions" role="note">{{ 'RULES' | translate }}</div>
      }
    </div>
  </div>

  <div class="board-space">
    <grid-container class="game" appSwipe (swipe)="move($event)">
      @for(cell of state$$(); track $index;) {
        <grid-cell bcgColour [bcg]="cell.value" [cellKey]="cell.key" [value]="cell.value" ></grid-cell>
      }
    </grid-container>
  </div>

</div>
